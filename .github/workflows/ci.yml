name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Release-Check (macOS x86_64)
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare x86_64 runtime libraries
        run: |
          ./Scripts/prepare_libs.sh

      - name: Run Unit Tests
        run: |
          swift test --arch x86_64

      - name: Build Distribution Packages
        run: |
          ./Scripts/package_distribution.sh

      - name: Run Release Verification Gate
        run: |
          ./Scripts/release_check.sh
