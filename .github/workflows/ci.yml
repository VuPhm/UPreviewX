name: CI

on:
  push:
    branches: [ main, "feature/*", "release/*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS Intel x86_64)
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (libmpv via Homebrew)
        run: |
          brew install mpv

      - name: Compile application
        run: make build

      - name: Run verification test suite
        run: make test

      - name: Package distribution artifacts
        run: make package

      - name: Run release pre-flight check
        run: make release-check
