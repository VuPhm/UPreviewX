name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release (macOS Intel x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Intel Architecture
        run: |
          echo "Host architecture: $(uname -m)"
          echo "macOS version: $(sw_vers -productVersion)"
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "Error: Expected x86_64 architecture on macos-15-intel but found $(uname -m)" >&2
            exit 1
          fi

      - name: Install dependencies (libmpv via Homebrew)
        run: |
          brew install mpv
          echo "==> Verifying Homebrew mpv installation..."
          brew --prefix mpv
          ls -la "$(brew --prefix mpv)/lib/libmpv"* || true

      - name: Prepare bundled runtime libraries
        run: make libs

      - name: Compile application (Release x86_64)
        run: make build

      - name: Run verification unit test suite
        run: make test

      - name: Package distribution artifacts (DMG, ZIP, SHA256)
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          VERSION="${VERSION}" make package

      - name: Run release pre-flight checks
        run: make release-check

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UPreviewX ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v0.3.0-beta.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
